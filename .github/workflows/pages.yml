name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'impostor-log/index.html'
      - 'impostor-log/manifest.webmanifest'
      - 'impostor-log/vendor/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的 push 不打断进行中的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 组装静态站点
        run: |
          mkdir -p _site/impostor-log/vendor _site/docs
          cp site/index.html                _site/index.html
          cp impostor-log/index.html        _site/impostor-log/index.html
          # PWA：「添加到主屏幕」用的 manifest 和图标
          cp impostor-log/manifest.webmanifest _site/impostor-log/
          cp impostor-log/*.png                _site/impostor-log/
          cp impostor-log/vendor/*            _site/impostor-log/vendor/
          cp docs/*.png                     _site/docs/
          # 没有构建步骤，Jekyll 也不要插手
          touch _site/.nojekyll
          echo "--- 站点内容 ---"; find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
