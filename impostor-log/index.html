<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>目击日记 · 内鬼推理</title>
<!-- 「添加到主屏幕」后全屏运行，没有浏览器地址栏。这几个文件只在联网托管时才用得上，
     index.html 本身仍然可以单独双击打开就玩。 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#0d121c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="目击日记">
<style>
  :root{
    --bg:#0d121c; --panel:#141c2a; --panel2:#1b2536; --line:#2c3a52;
    --ink:#dfe6f2; --dim:#8493ab;
    --amber:#e7a83f; --red:#cf4b3d; --violet:#8663e0; --mint:#4fbf9a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  /* 手机地址栏伸缩时 100% 会跳动，dvh 更稳（不支持就退回上面那行） */
  @supports (height:100dvh){ html,body{height:100dvh} }
  body{background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;user-select:none}
  .hud{display:flex;align-items:center;gap:10px;padding:7px 12px 5px;font-size:13px}
  .hud .room{font-weight:700;letter-spacing:.5px}
  .hud .sp{flex:1}
  .chip{color:var(--dim);font-variant-numeric:tabular-nums}
  .chip b{color:var(--ink);font-weight:600}
  .eye.on{color:var(--amber)}
  .tbar{display:flex;align-items:center;gap:8px;padding:0 12px 7px;border-bottom:1px solid var(--line)}
  .tbar span{font-size:11.5px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
  .track{flex:1;height:7px;border-radius:4px;background:#101724;border:1px solid var(--line);overflow:hidden}
  .track i{display:block;height:100%;background:var(--mint);width:0%;transition:width .35s}
  .track.hot i{background:var(--amber)}
  .stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0a0e16}
  canvas{width:100%;height:100%;object-fit:contain;display:block;touch-action:none}
  canvas[hidden]{display:none!important}
  #cv3{object-fit:fill}
  .alertline{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--amber);pointer-events:none;opacity:0;transition:opacity .25s}
  .alertline.show{opacity:1}
  .siren{position:absolute;top:0;left:0;right:0;padding:5px;text-align:center;font-size:13px;font-weight:700;
    background:rgba(207,75,61,.22);color:#ffb3aa;display:none;font-variant-numeric:tabular-nums}
  .siren.show{display:block}
  /* 断电横幅和事件提示都钉在 stage 顶部，同时出现会叠成一团 */
  .siren.show ~ .alertline{top:32px}
  .ctrl{display:flex;align-items:flex-start;gap:10px;padding:9px 12px 12px;border-top:1px solid var(--line)}
  .stick{width:104px;height:104px;border-radius:50%;border:1px solid var(--line);
    background:radial-gradient(circle at 50% 50%,#182132,#111927);position:relative;flex:none;touch-action:none}
  .stick i{position:absolute;width:42px;height:42px;border-radius:50%;left:31px;top:31px;background:#3a4d6e;border:1px solid #55708f}
  .acts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:7px}
  button{font-family:inherit;font-size:14.5px;font-weight:600;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:9px 5px;cursor:pointer}
  button:disabled{opacity:.3}
  button.kill{background:#3a1a1c;border-color:#7d3630;color:#ffb3aa}
  button.rep{background:#3a2c12;border-color:#7d6224;color:#ffd79a}
  button.vent{background:#122e2b;border-color:#2a6a5f}
  button.wide{grid-column:1/-1}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .cd{font-size:10.5px;font-weight:400;color:var(--dim);display:block;margin-top:1px}
  /* 手机横屏：竖直堆叠会把地图压成一条（实测 iPhone 横屏画布只剩 134px 高）。
     改成「地图占左、控件收进右侧竖栏」。 */
  @media (orientation:landscape) and (max-height:600px){
    /* 用 grid 显式指定，flex-wrap 在这里分配不出想要的剩余高度 */
    body{display:grid;grid-template-columns:1fr 250px;grid-template-rows:auto auto 1fr;
      grid-template-areas:"hud hud" "tbar tbar" "stage ctrl"}
    .hud{grid-area:hud} .tbar{grid-area:tbar}
    .stage{grid-area:stage;min-width:0;min-height:0}
    .ctrl{grid-area:ctrl;flex-direction:column;align-items:stretch;min-height:0;
      border-top:0;border-left:1px solid var(--line);gap:8px;padding:8px 10px 10px;overflow-y:auto}
    .ctrl .stick{align-self:center;width:88px;height:88px}
    .ctrl .stick i{width:36px;height:36px;left:26px;top:26px}
    .acts{flex:1;align-content:start}
    button{font-size:13px;padding:7px 4px}
    .cd{font-size:10px}
  }
  /* 平板竖屏地方大，摇杆和按钮跟着放大，别让拇指去够小目标 */
  @media (min-width:700px){
    .stick{width:128px;height:128px}
    .stick i{width:52px;height:52px;left:38px;top:38px}
    button{font-size:16px;padding:12px 6px}
  }
  .overlay{position:fixed;inset:0;background:rgba(6,9,15,.95);display:none;flex-direction:column;z-index:9}
  .overlay.show{display:flex}
  .ohead{padding:12px 14px;border-bottom:1px solid var(--line)}
  .ohead h2{margin:0;font-size:16px;letter-spacing:1px}
  .ohead p{margin:4px 0 0;font-size:12px;color:var(--dim)}
  .log{flex:1;overflow-y:auto;padding:12px 14px;font-size:14px;line-height:1.55}
  .say{margin:0 0 10px;opacity:0;animation:in .28s forwards}
  @keyframes in{to{opacity:1}}
  .say b{font-weight:700}
  .say.sys{color:var(--dim);font-size:12.5px;border-left:2px solid var(--line);padding-left:8px}
  .say.hit{color:#ffb3aa}
  .say.ok{color:#8fe0c2}
  .choices{padding:10px 14px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
  .choices button{flex:1 1 44%;font-size:14px;padding:11px 4px}
  .tallies{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
  .tag{font-size:12px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);background:var(--panel)}
  pre.diary{background:#0a0f18;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;
    line-height:1.45;overflow-x:auto;color:#9fd0c0;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
  .note{font-size:11.5px;color:var(--dim);margin:6px 0 0}
  .end{position:fixed;inset:0;background:rgba(6,9,15,.96);display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;z-index:10;padding:24px;text-align:center}
  .end.show{display:flex}
  .cfgbtn{font-size:11px;padding:3px 9px;border-radius:7px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim);font-weight:600;line-height:1.4}
  .cfgbtn.live{color:var(--mint);border-color:#2a6a5f}
  .cfgbtn.err{color:#ffb3aa;border-color:#7d3630}
  .modal{position:fixed;inset:0;background:rgba(6,9,15,.94);display:none;z-index:20;
    flex-direction:column;padding:16px;overflow-y:auto}
  .modal.show{display:flex}
  .modal h3{margin:0 0 3px;font-size:16px;letter-spacing:1px}
  .modal label{display:block;font-size:11.5px;color:var(--dim);margin:11px 0 3px}
  .modal input{width:100%;padding:9px 10px;font-size:14px;font-family:inherit;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink)}
  .modal .row{display:flex;gap:8px;margin-top:14px}
  .modal .row button{flex:1}
  .fine{font-size:11px;color:var(--dim);line-height:1.6;margin:10px 0 0}
  .fine b{color:var(--amber);font-weight:600}
  .pill{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:99px;
    border:1px solid var(--line);color:var(--dim);margin:8px 6px 0 0}
  .pill.on{color:var(--mint);border-color:#2a6a5f}
  .say.think{color:var(--dim);font-style:italic;font-size:12.5px}
  .replybox{display:flex;gap:7px;width:100%}
  .replybox input{flex:1;padding:11px 12px;font-size:15px;font-family:inherit;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink)}
  .replybox button{flex:none;padding:11px 18px}
  .hintline{font-size:11.5px;color:var(--dim);width:100%;margin:0 0 7px}
  .end h1{font-size:26px;margin:0;letter-spacing:2px}
  .end p{margin:0;color:var(--dim);font-size:14px;max-width:30em;line-height:1.6}
</style>
</head>
<body>

<div class="hud">
  <span class="room" id="hRoom">食堂</span>
  <span class="sp"></span>
  <span class="chip">存活 <b id="hAlive">5</b></span>
  <span class="chip eye" id="hSeen">可见 <b>0</b></span>
  <button id="b3d" class="cfgbtn" title="切换 2D / 3D 视角">3D</button>
  <button id="bCfg" class="cfgbtn" title="模型设置">AI</button>
</div>
<div class="tbar">
  <span>任务</span>
  <span class="track" id="trk"><i id="hTask"></i></span>
  <span id="hTaskN">0 / 27</span>
</div>

<div class="stage">
  <canvas id="cv" width="1000" height="670"></canvas>
  <canvas id="cv3" hidden></canvas>
  <div class="siren" id="siren"></div>
  <div class="alertline" id="alert"></div>
</div>

<div class="ctrl">
  <div class="stick" id="stick"><i id="knob"></i></div>
  <div class="acts">
    <button class="kill" id="bKill" disabled>刀<span class="cd" id="cdKill">冷却 14s</span></button>
    <button class="rep" id="bRep" disabled>报告<span class="cd">发现尸体</span></button>
    <button class="vent" id="bVent" disabled>钻管道<span class="cd" id="cdVent">站在通风口</span></button>
    <button id="bSab">断电<span class="cd" id="cdSab">就绪</span></button>
    <button class="wide" id="bMelt">反应堆熔毁<span class="cd" id="cdMelt">逼他们放下任务</span></button>
  </div>
</div>

<div class="overlay" id="ov">
  <div class="ohead"><h2 id="ovT">紧急会议</h2><p id="ovS"></p></div>
  <div class="log" id="ovLog"></div>
  <div class="choices" id="ovC"></div>
</div>

<div class="modal" id="cfg">
  <h3>AI 船员设置</h3>
  <p class="fine">四个船员会读自己的目击日记，用模型推理后发言、投票。留空则使用内置规则 AI。</p>
  <label>主 API 地址（OpenAI 兼容）</label>
  <input id="cBase" placeholder="https://api.deepseek.com/v1" autocomplete="off">
  <label>主 API Key</label>
  <input id="cKey" type="password" placeholder="sk-..." autocomplete="off">
  <label>主模型</label>
  <input id="cModel" placeholder="deepseek-chat" autocomplete="off">
  <label>备用 API 地址（可留空）</label>
  <input id="cBase2" placeholder="https://api.openai.com/v1" autocomplete="off">
  <label>备用 API Key</label>
  <input id="cKey2" type="password" placeholder="sk-..." autocomplete="off">
  <label>备用模型</label>
  <input id="cModel2" placeholder="gpt-4o-mini" autocomplete="off">
  <div class="row">
    <button id="cSave">保存</button>
    <button id="cTest">测试连接</button>
  </div>
  <div class="row">
    <button id="cClear" style="background:#3a1a1c;border-color:#7d3630;color:#ffb3aa">清除密钥</button>
    <button id="cClose">关闭</button>
  </div>
  <p class="fine" id="cStat"></p>
  <p class="fine"><b>关于密钥</b>：只存在这台设备的 localStorage 里，不会上传到任何第三方。
  但它会随请求出现在浏览器的「网络」面板中 —— 直播或录屏时先点「清除密钥」。
  也不要把填好密钥的页面部署到公网。</p>
</div>

<div class="end" id="endS">
  <h1 id="endT"></h1>
  <p id="endP"></p>
  <button onclick="location.reload()" style="padding:12px 28px">再来一局</button>
</div>

<script src="vendor/three.min.js" onerror="window.__no3d=1"></script>
<script>
(()=>{
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=1000,H=670;

/* ---------- 地图 ---------- */
const RN=['上引擎','食堂','武器室','反应堆','管理室','导航室','下引擎','电力室','护盾室'];
const rooms=[],corrV=[],corrH=[],solid=[];
for(let r=0;r<3;r++)for(let c=0;c<3;c++)
  rooms.push({i:r*3+c,name:RN[r*3+c],x:40+c*350,y:40+r*220,w:220,h:150,cx:150+c*350,cy:115+r*220});
for(let r=0;r<3;r++)for(let c=0;c<2;c++){const y=115+r*220;
  corrH.push({x:260+c*350,y:y-32,w:130,h:64}); solid.push({x:220+c*350,y:y-32,w:210,h:64});}
for(let c=0;c<3;c++)for(let r=0;r<2;r++){const x=150+c*350;
  corrV.push({x:x-32,y:190+r*220,w:64,h:70}); solid.push({x:x-32,y:150+r*220,w:64,h:150});}
rooms.forEach(r=>solid.push(r));
const zones=[...rooms,...corrH.map((c,i)=>({...c,name:'走廊',i:100+i})),...corrV.map((c,i)=>({...c,name:'走廊',i:200+i}))];

const nodes=rooms.map(r=>({x:r.cx,y:r.cy,room:r.i,adj:[]}));
function link(a,b){nodes[a].adj.push(b);nodes[b].adj.push(a);}
corrH.forEach((c,k)=>{const r=(k/2|0),cc=k%2,n=nodes.push({x:c.x+65,y:c.y+32,room:-1,adj:[]})-1;
  link(n,r*3+cc);link(n,r*3+cc+1);});
corrV.forEach((c,k)=>{const cc=(k/2|0),r=k%2,n=nodes.push({x:c.x+32,y:c.y+35,room:-1,adj:[]})-1;
  link(n,r*3+cc);link(n,(r+1)*3+cc);});
function path(a,b){const prev={},q=[a],seen={[a]:1};
  while(q.length){const n=q.shift(); if(n===b)break;
    for(const m of nodes[n].adj) if(!seen[m]){seen[m]=1;prev[m]=n;q.push(m);}}
  const p=[];let n=b; while(n!==a&&prev[n]!==undefined){p.unshift(n);n=prev[n];} return p;}

const VENTS=[[0,6],[7,2],[3,5]];
const ventPos=i=>{const r=rooms[i];return{x:r.x+r.w-38,y:r.y+r.h-30};};
function zoneOf(x,y){for(const z of zones) if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h) return z; return null;}
function canStand(x,y,r=14){for(const s of solid) if(x>=s.x+r&&x<=s.x+s.w-r&&y>=s.y+r&&y<=s.y+s.h-r) return true; return false;}

/* ---------- 任务点 ---------- */
const SPOT=[];
rooms.forEach(r=>{SPOT.push({r:r.i,x:r.x+50,y:r.y+114,owner:-1,done:!1});
                  SPOT.push({r:r.i,x:r.x+r.w-50,y:r.y+60,owner:-1,done:!1});
                  SPOT.push({r:r.i,x:r.cx+18,y:r.y+r.h-34,owner:-1,done:!1});});

/* ---------- 角色 ---------- */
const COL=['#8663e0','#cf4b3d','#3f83d6','#4fbf9a','#e7a83f'];
const NM=['紫(你)','红','蓝','绿','黄'];
const P=[];
for(let i=0;i<5;i++){const st=rooms[1];
  P.push({id:i,name:NM[i],col:COL[i],x:st.cx+(i-2)*36,y:st.cy+(i%2?26:-18),
    alive:!0,imp:i===0,log:[],path:[],mt:null,tasks:[],cur:null,tt:0,tmax:1,doing:!1,fixing:!1,goal:1,
    sus:{},susIdx:0,chase:null,cx:0,cy:0,chBud:8});}
const ME=P[0];
const TASKT=14, AISPD=112, KCD=12;
function claimSpot(a){let best=null,bd=1e9;
  SPOT.forEach((s,i)=>{if(s.done||s.owner>=0)return;const d=Math.hypot(s.x-a.x,s.y-a.y);
    if(d<bd){bd=d;best=i;}});
  if(best!==null)SPOT[best].owner=a.id; return best;}
function release(id){SPOT.forEach(s=>{if(!s.done&&s.owner===id)s.owner=-1;});}

let bodies=[],t=0,killCD=14,sabCD=20,over=!1,meeting=!1,msgT=0;
let taskTotal=SPOT.length,taskDone=0;
let emg=0,emgT=0,emgRoom=7;      /* 1=断电  2=熔毁 */

/* ---------- 输入 ---------- */
let vx=0,vy=0;
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
let sid=null;
stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);mv(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)mv(e);});
/* 摇杆几何全部从实际尺寸算，CSS 里改大小不用动 JS */
const stickGeo=()=>{const b=stick.getBoundingClientRect(),kr=knob.offsetWidth/2||21;
  return {R:b.width/2, kr, max:Math.max(1,b.width/2-kr), left:b.left, top:b.top};};
const rel=()=>{sid=null;vx=vy=0;const g=stickGeo();
  knob.style.left=(g.R-g.kr)+'px';knob.style.top=(g.R-g.kr)+'px';};
stick.addEventListener('pointerup',rel); stick.addEventListener('pointercancel',rel);
function mv(e){const g=stickGeo();
  let dx=e.clientX-g.left-g.R, dy=e.clientY-g.top-g.R;
  const d=Math.hypot(dx,dy)||1, m=Math.min(d,g.max); dx=dx/d*m; dy=dy/d*m;
  knob.style.left=(g.R-g.kr+dx)+'px'; knob.style.top=(g.R-g.kr+dy)+'px';
  vx=dx/g.max; vy=dy/g.max;}
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

/* ---------- 主循环 ---------- */
let last=performance.now(),logT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!meeting&&!over)step(dt);
  (R3.on?R3.frame:draw)(); requestAnimationFrame(loop);}
requestAnimationFrame(loop);

function step(dt){
  t+=dt; killCD=Math.max(0,killCD-dt); sabCD=Math.max(0,sabCD-dt);
  if(emg){emgT-=dt;
    const at=P.filter(p=>p.alive&&!p.imp&&zoneOf(p.x,p.y)===rooms[emgRoom]).length;
    if(at>=(emg===2?2:1)) clearEmg(emg===2?'反应堆稳住了':'电力恢复');
    else if(emgT<=0){ if(emg===2) return end(!0,'反应堆熔毁。他们全程忙着做任务,没人来得及修。');
      clearEmg('电力自行恢复');}}
  // 玩家移动
  let mx=vx,my=vy;
  if(keys.a||keys.arrowleft)mx=-1; if(keys.d||keys.arrowright)mx=1;
  if(keys.w||keys.arrowup)my=-1; if(keys.s||keys.arrowdown)my=1;
  const moving=Math.hypot(mx,my)>.05, sp=175*dt;
  const nx=ME.x+mx*sp, ny=ME.y+my*sp;
  if(canStand(nx,ME.y))ME.x=nx; if(canStand(ME.x,ny))ME.y=ny;
  // 假装做任务
  const spot=nearSpot();
  if(spot&&!moving){ if(!ME.doing){ME.doing=!0;ME.tt=TASKT;ME.tmax=TASKT;}
    else {ME.tt-=dt; if(ME.tt<=0){ME.doing=!1;note('假装完成一个任务');}} }
  else if(ME.doing&&(moving||!spot)) ME.doing=!1;
  for(let i=1;i<5;i++){const a=P[i]; if(a.alive) ai(a,dt);}
  logT+=dt; if(logT>=.5){logT=0;sample();updateSus();nudge(.5);}
  ui();
  if(P.filter(p=>p.alive&&!p.imp).length<=1) end(!0,'船员只剩一个了。刀完收工。');
  if(taskDone>=taskTotal) end(!1,'任务条满了。他们不用抓到你也能赢。');
}

function ai(a,dt){
  if(chaseStep(a,dt)) return;
  // 紧急情况优先
  if(emg&&!a.fixing){a.fixing=!0;a.doing=!1;a.tt=0;a.mt=null;release(a.id);a.cur=null;a.goal=emgRoom;a.path=path(nearNode(a),emgRoom);}
  if(!emg&&a.fixing){a.fixing=!1;a.path=[];a.mt=null;}
  if(a.tt>0){a.tt-=dt;
    if(a.tt<=0){ if(a.doing&&a.cur!==null){taskDone++;SPOT[a.cur].done=!0;a.cur=null;}
      a.doing=!1;} return;}
  if(!a.path.length&&!a.mt){
    if(a.fixing){const r=rooms[emgRoom];a.mt={x:r.cx+(Math.random()*90-45),y:r.cy+(Math.random()*60-30)};}
    else{const k=claimSpot(a);
      if(k!==null){a.cur=k;const s=SPOT[k];a.goal=s.r;
        a.path=path(nearNode(a),s.r); if(!a.path.length)a.mt={x:s.x,y:s.y};}
      else{a.cur=null;a.goal=Math.random()*9|0;a.path=path(nearNode(a),a.goal);
        if(!a.path.length)a.mt={x:rooms[a.goal].cx,y:rooms[a.goal].cy};}}
  }
  let tx,ty;
  if(a.path.length){tx=nodes[a.path[0]].x;ty=nodes[a.path[0]].y;}
  else if(a.mt){tx=a.mt.x;ty=a.mt.y;} else return;
  const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy);
  if(d<7){
    if(a.path.length){a.path.shift();
      if(!a.path.length){
        if(a.fixing){const r=rooms[emgRoom];a.mt={x:r.cx+(Math.random()*90-45),y:r.cy+(Math.random()*60-30)};}
        else if(a.cur!==null){const s=SPOT[a.cur];a.mt={x:s.x,y:s.y};}
        else {const g=rooms[a.goal];a.mt={x:g.cx+(Math.random()*120-60),y:g.cy+(Math.random()*80-40)};}}}
    else{a.mt=null;
      if(a.fixing){} else if(a.cur!==null){a.doing=!0;a.tt=TASKT;a.tmax=TASKT;} else {a.tt=1.6;a.tmax=1.6;}}
    return;}
  const s=Math.min(d,AISPD*dt); a.x+=dx/d*s; a.y+=dy/d*s;
  for(const b of bodies) if(!b.rep&&Math.hypot(b.x-a.x,b.y-a.y)<110&&zoneOf(b.x,b.y)===zoneOf(a.x,a.y)){
    b.rep=!0; openMeeting(a,b); return;}
}
function nearNode(a){let best=0,bd=1e9;
  nodes.forEach((n,i)=>{const d=Math.hypot(n.x-a.x,n.y-a.y); if(d<bd){bd=d;best=i;}}); return best;}
function nearSpot(){for(const s of SPOT) if(Math.hypot(s.x-ME.x,s.y-ME.y)<28) return s; return null;}

/* ---------- 目击日记 ---------- */
const vision=()=>emg===1?130:265;
function sample(){
  for(const p of P){ if(!p.alive)continue;
    const z=zoneOf(p.x,p.y),saw=[],tk=[];
    for(const q of P){ if(q===p||!q.alive)continue;
      if(zoneOf(q.x,q.y)===z&&Math.hypot(q.x-p.x,q.y-p.y)<vision()){saw.push(q.id); if(q.doing)tk.push(q.id);}}
    p.log.push({t:+t.toFixed(1),room:z?z.name:'?',saw,tk,dark:emg===1||undefined});}
}
/* ---------- 行为层：怀疑度驱动的盯梢 ----------
   船员在地图上的行动也要建立在受限信息之上：怀疑度只从自己的日记里长出来，
   盯梢只在此刻真的看得见目标时才更新位置。任何时候都不要读别人的坐标。 */
const SUS_FOLLOW=10, SUS_KEEP=6;      // 起停用不同阈值，避免在边界反复横跳
const CH_BUD=8, CH_START=4;           // 预算耗尽后要攒回 CH_START 才能再起一次盯梢
let chases=0, staleWrite=0;   /* 供端到端测试观察 */
function canSee(a,q){return q.alive&&zoneOf(q.x,q.y)===zoneOf(a.x,a.y)&&Math.hypot(q.x-a.x,q.y-a.y)<vision();}

function updateSus(){
  for(const a of P){
    if(!a.alive||a.imp)continue;
    // 逐条消费尚未折算过的日记。击杀那条是 bKill 直接追加的，
    // 只看最后一条的话会被随后的 sample() 盖掉，铁证就永远不触发。
    if(a.susIdx===undefined)a.susIdx=0;
    for(let i=Math.max(1,a.susIdx);i<a.log.length;i++){
      const cur=a.log[i],prev=a.log[i-1];
      if(cur.kill){ a.sus[cur.saw[0]]=99; continue; }   // 亲眼看见动手，顶满
      // 没看见的人慢慢淡出视线：怀疑度不该只涨不跌
      for(const id in a.sus)
        if(!cur.saw.includes(+id)) a.sus[id]=Math.max(0,a.sus[id]-0.12);
      for(const id of cur.saw){
        // 蹲在任务点上 = 洗清得很快；在场却什么都不干 = 慢慢可疑。
        // 两边不对称是有意的：真船员一个任务 14 秒，怀疑度会被压到 0，
        // 所以只有"被盯着看了十几秒还什么都没干"才够得着阈值。
        if(cur.tk.includes(id)) a.sus[id]=Math.max(0,(a.sus[id]||0)-2.0);
        else a.sus[id]=(a.sus[id]||0)+0.4;
        if(cur.dark) a.sus[id]=(a.sus[id]||0)+0.3;
      }
      // 我没挪窝，人却凭空没了 —— 可能钻了管道（也可能只是走开了，所以不顶满）
      if(cur.room===prev.room&&!prev.kill) for(const id of prev.saw)
        if(!cur.saw.includes(id)) a.sus[id]=(a.sus[id]||0)+2.5;
    }
    a.susIdx=a.log.length;
  }
}

/* 端到端测试用的观察窗口（只读，不影响对局） */
window.__dbg=()=>({
  sus:P.slice(1).map(a=>a.sus[0]||0),
  chases,
  staleWrite,                                     // 越权写入最后目击点的次数，必须为 0
  overBudget:P.slice(1).some(a=>a.chase!==null&&a.chBud<=0),
  me:[Math.round(ME.x),Math.round(ME.y)],         // 供触摸操作测试观察
  emg,
  r3:R3.on?R3.lights():null,
});

function chaseTarget(a){
  let best=null,bs=0;
  for(const q of P){ if(q===a||!q.alive)continue;
    // 已经在盯的人用较低的门槛，掉一点就撒手会导致起停抖动
    const need=(a.chase===q.id)?SUS_KEEP:SUS_FOLLOW;
    const v=a.sus[q.id]||0;
    if(v>=need&&v>bs&&canSee(a,q)){bs=v;best=q;} }
  return best;
}

/* 盯梢步进。返回 true 表示这一帧被盯梢接管，不再走任务逻辑。 */
function chaseStep(a,dt){
  if(a.fixing){a.chase=null;return !1;}
  const tgt=chaseTarget(a);
  // 起手要够本钱，续盯只要还有余额——否则预算一见底就重启，会疯狂起停
  const enough=(a.chase!==null)?(a.chBud>0):(a.chBud>=CH_START);
  if(tgt&&enough){
    if(a.cur!==null){release(a.id);a.cur=null;}
    if(a.chase!==tgt.id)chases++;
    // 最后目击点只在此刻真的看得见时才刷新。看不见还去追新位置＝读了它不该有的坐标。
    if(!canSee(a,tgt))staleWrite++;            // 恒为 0；改坏了这里测试会抓到
    a.chase=tgt.id; a.cx=tgt.x; a.cy=tgt.y;
  }
  if(a.chase===null){ a.chBud=Math.min(CH_BUD,a.chBud+dt*.5); return !1; }
  a.chBud-=dt;
  if(a.chBud<=0){                               // 盯梢预算耗尽：回去干活，别让任务条卡死
    a.sus[a.chase]=Math.min(a.sus[a.chase]||0,SUS_FOLLOW-1);
    a.chase=null; a.path=[]; a.mt=null; return !1;
  }
  a.path=[]; a.mt=null; a.doing=!1; a.tt=0;
  const dx=a.cx-a.x,dy=a.cy-a.y,d=Math.hypot(dx,dy);
  if(d<30){ if(!tgt){a.chase=null;} return !0; } // 摸到最后目击点还是没人 → 放弃
  const sp=Math.min(d,AISPD*dt);
  const nx=a.x+dx/d*sp, ny=a.y+dy/d*sp;
  let moved=!1;
  if(canStand(nx,a.y)){a.x=nx;moved=!0;}
  if(canStand(a.x,ny)){a.y=ny;moved=!0;}
  if(!moved) a.chBud-=dt*3;                     // 撞墙就快点放弃，别卡住
  return !0;
}

function witnesses(){const z=zoneOf(ME.x,ME.y),out=[];
  for(let i=1;i<5;i++){const a=P[i];
    if(a.alive&&zoneOf(a.x,a.y)===z&&Math.hypot(a.x-ME.x,a.y-ME.y)<vision())out.push(a);} return out;}

/* ---------- 行动 ---------- */

  for(let i=1;i<5;i++){const a=P[i];if(!a.alive)continue;const d=Math.hypot(a.x-ME.x,a.y-ME.y);
    if(d<bd){bd=d;best=a;}} return bd<72?best:null;}
function nearVent(){for(const v of VENTS)for(const [s,d] of [[v[0],v[1]],[v[1],v[0]]]){
    const p=ventPos(s); if(Math.hypot(p.x-ME.x,p.y-ME.y)<40) return [s,d];} return null;}
function nearBody(){for(const b of bodies) if(!b.rep&&Math.hypot(b.x-ME.x,b.y-ME.y)<80) return b; return null;}

/* ---------- 绘制 ---------- */
function ring(x,y,p,col){ctx.strokeStyle='#0e1622';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,23,0,7);ctx.stroke();
  ctx.strokeStyle=col;ctx.beginPath();ctx.arc(x,y,23,-Math.PI/2,-Math.PI/2+p*Math.PI*2);ctx.stroke();}
/* ---------- 渲染 ----------
   静态地图（地板、墙、房名、通风口）一帧都不会变，烘焙进离屏 canvas 画一次，
   之后每帧只贴图 + 画动态层。既能塞进更多细节，也比每帧重画一堆矩形便宜。 */
const ACCENT=['#e7a83f','#7f9ccb','#cf4b3d','#4fbf9a','#3ddbd9','#5b8dd6','#e7a83f','#e0c34f','#8663e0'];

function rr(g,x,y,w,h,r){g.beginPath();
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* 把 #rrggbb 提亮 amt（0-255），用于角色高光 */
function lighten(hex,amt){const n=parseInt(hex.slice(1),16);
  const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.min(255,v+amt));
  return 'rgb('+c.join(',')+')';}

let mapCv=null;
const lightCv=document.createElement('canvas');lightCv.width=W;lightCv.height=H;
const lctx=lightCv.getContext('2d');

function bakeMap(){
  mapCv=document.createElement('canvas');mapCv.width=W;mapCv.height=H;
  const g=mapCv.getContext('2d');
  g.fillStyle='#06090f';g.fillRect(0,0,W,H);

  // 船体外壳：所有可行走区域外扩一圈，连成一片有厚度的舱体
  g.fillStyle='#0e1420';
  solid.forEach(s=>{rr(g,s.x-10,s.y-10,s.w+20,s.h+20,16);g.fill();});
  g.strokeStyle='#1b2536';g.lineWidth=2;
  solid.forEach(s=>{rr(g,s.x-10,s.y-10,s.w+20,s.h+20,16);g.stroke();});

  // 走廊地板（比房间暗一档，走过去有明暗变化）
  [...corrH,...corrV].forEach(c=>{
    g.fillStyle='#121a28';rr(g,c.x-2,c.y-2,c.w+4,c.h+4,5);g.fill();});
  // 走廊只描两条平行边，免得在门口画出横线
  g.strokeStyle='#2a3950';g.lineWidth=2.5;g.beginPath();
  corrH.forEach(c=>{g.moveTo(c.x,c.y-2);g.lineTo(c.x+c.w,c.y-2);
                    g.moveTo(c.x,c.y+c.h+2);g.lineTo(c.x+c.w,c.y+c.h+2);});
  corrV.forEach(c=>{g.moveTo(c.x-2,c.y);g.lineTo(c.x-2,c.y+c.h);
                    g.moveTo(c.x+c.w+2,c.y);g.lineTo(c.x+c.w+2,c.y+c.h);});
  g.stroke();

  rooms.forEach(r=>{
    // 地板渐变
    const grad=g.createLinearGradient(r.x,r.y,r.x,r.y+r.h);
    grad.addColorStop(0,'#1b2537');grad.addColorStop(1,'#131b29');
    g.fillStyle=grad;rr(g,r.x,r.y,r.w,r.h,11);g.fill();
    // 房间色调：每间一个很淡的主色，扫一眼就知道自己在哪
    g.save();g.globalAlpha=.09;g.fillStyle=ACCENT[r.i];
    rr(g,r.x,r.y,r.w,r.h,11);g.fill();g.restore();
    // 地板格栅
    g.save();rr(g,r.x,r.y,r.w,r.h,11);g.clip();
    g.strokeStyle='rgba(255,255,255,.03)';g.lineWidth=1;g.beginPath();
    for(let x=r.x+24;x<r.x+r.w;x+=24){g.moveTo(x,r.y);g.lineTo(x,r.y+r.h);}
    for(let y=r.y+24;y<r.y+r.h;y+=24){g.moveTo(r.x,y);g.lineTo(r.x+r.w,y);}
    g.stroke();g.restore();
    // 墙：外圈深、内圈用房间色描一道细边
    g.strokeStyle='#31415c';g.lineWidth=3;rr(g,r.x,r.y,r.w,r.h,11);g.stroke();
    g.save();g.globalAlpha=.34;g.strokeStyle=ACCENT[r.i];g.lineWidth=1.5;
    rr(g,r.x+3,r.y+3,r.w-6,r.h-6,9);g.stroke();g.restore();
    // 房名
    g.fillStyle='#61728c';g.font='600 20px sans-serif';g.textAlign='center';
    g.fillText(r.name,r.cx,r.y+30);
  });

  // 通风口
  VENTS.flat().forEach(i=>{const v=ventPos(i);
    g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=8;g.shadowOffsetY=2;
    g.fillStyle='#1d2c38';rr(g,v.x-17,v.y-12,34,24,4);g.fill();g.restore();
    g.strokeStyle='#4a7a86';g.lineWidth=2;rr(g,v.x-17,v.y-12,34,24,4);g.stroke();
    g.strokeStyle='rgba(122,190,205,.55)';g.lineWidth=2;g.beginPath();
    for(let k=-1;k<2;k++){g.moveTo(v.x-11,v.y+k*7);g.lineTo(v.x+11,v.y+k*7);}g.stroke();});

  // 暗角，把视线收拢到舱体中间
  const vg=g.createRadialGradient(W/2,H/2,H*0.46,W/2,H/2,H*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.38)');
  g.fillStyle=vg;g.fillRect(0,0,W,H);
}

/* 角色：投影 + 球面高光 + 朝向护目镜 + 走路轻微上下浮动 */
/* 朝向和走路浮动由帧间位移推出来，2D / 3D 两个渲染器共用 */
function updateFacing(p){
  const dx=p.x-(p._lx===undefined?p.x:p._lx), dy=p.y-(p._ly===undefined?p.y:p._ly);
  p._sp=Math.hypot(dx,dy);
  if(p._sp>0.12)p.face=Math.atan2(dy,dx);
  if(p.face===undefined)p.face=0;
  p._lx=p.x;p._ly=p.y;
  p._bob=p._sp>0.12?Math.sin(t*13+p.id*1.7)*1.8:0;
}

function drawActor(p,witnessed){
  const sp=p._sp||0, y=p.y+(p._bob||0);

  ctx.save();ctx.globalAlpha=.36;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(p.x,p.y+15,14,5.5,0,0,7);ctx.fill();ctx.restore();

  if(witnessed){ctx.strokeStyle='rgba(231,168,63,.8)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(p.x,y,27,0,7);ctx.stroke();}

  const g=ctx.createRadialGradient(p.x-5,y-6,1,p.x,y,17);
  g.addColorStop(0,lighten(p.col,42));g.addColorStop(1,p.col);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,y,16,0,7);ctx.fill();
  ctx.strokeStyle='rgba(5,9,16,.92)';ctx.lineWidth=3;ctx.stroke();

  ctx.save();ctx.translate(p.x,y);ctx.rotate(p.face);
  if(p.imp){ctx.fillStyle='rgba(6,10,18,.72)';
    ctx.beginPath();ctx.arc(-6,0,4.5,0,7);ctx.fill();}
  ctx.fillStyle='rgba(196,225,255,.94)';
  ctx.beginPath();ctx.ellipse(6,0,7,5.6,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.beginPath();ctx.ellipse(7.6,-1.7,2.6,1.9,0,0,7);ctx.fill();
  ctx.restore();

  ctx.fillStyle='#a9bad2';ctx.font='600 15px sans-serif';ctx.textAlign='center';
  ctx.fillText(p.name,p.x,y-31);
}

function draw(){
  if(!mapCv)bakeMap();
  ctx.drawImage(mapCv,0,0);

  // 任务点：本人负责的那颗会呼吸
  SPOT.forEach(s=>{ if(s.done)return;
    const live=s.owner>0&&P[s.owner].alive, col=live?P[s.owner].col:'#3a4a63';
    const pulse=.5+.5*Math.sin(t*2.2+s.x*.05);
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.PI/4);
    if(live){ctx.globalAlpha=.14+.13*pulse;ctx.fillStyle=col;ctx.fillRect(-15,-15,30,30);}
    ctx.globalAlpha=live?.6:.32;ctx.fillStyle=col;ctx.fillRect(-8,-8,16,16);
    ctx.globalAlpha=1;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.strokeRect(-8,-8,16,16);
    ctx.restore();});

  if(emg===2){ctx.fillStyle='rgba(150,26,26,'+(.11+.07*Math.sin(t*6))+')';ctx.fillRect(0,0,W,H);
    const r=rooms[3];ctx.save();ctx.shadowColor='#cf4b3d';ctx.shadowBlur=22;
    ctx.strokeStyle='#cf4b3d';ctx.lineWidth=4;rr(ctx,r.x,r.y,r.w,r.h,11);ctx.stroke();ctx.restore();}

  bodies.forEach(b=>{
    ctx.save();ctx.globalAlpha=.4;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(b.x,b.y+8,20,7,0,0,7);ctx.fill();ctx.restore();
    ctx.fillStyle=COL[b.id];ctx.beginPath();ctx.arc(b.x,b.y,17,Math.PI,0);ctx.fill();
    ctx.strokeStyle='rgba(5,9,16,.9)';ctx.lineWidth=3;ctx.stroke();
    ctx.strokeStyle='#0a0e16';ctx.lineWidth=4;ctx.beginPath();
    ctx.moveTo(b.x-9,b.y-9);ctx.lineTo(b.x+9,b.y+3);
    ctx.moveTo(b.x+9,b.y-9);ctx.lineTo(b.x-9,b.y+3);ctx.stroke();});

  const wit=new Set(witnesses().map(a=>a.id));
  for(const p of P){ if(!p.alive)continue;
    updateFacing(p);
    if(p.doing) ring(p.x,p.y,1-p.tt/p.tmax,p.imp?'#8663e0':'#4fbf9a');
    drawActor(p,wit.has(p.id));}

  // 断电：改成以你为中心的手电筒，比一层平铺的灰蒙蒙有压迫感得多。
  // 外圈最暗 .66，远处的人还看得见轮廓——调这个数就能改难度。
  if(emg===1){
    lctx.clearRect(0,0,W,H);
    lctx.fillStyle='rgba(3,5,10,.66)';lctx.fillRect(0,0,W,H);
    lctx.globalCompositeOperation='destination-out';
    const R=vision()*1.25;
    const lg=lctx.createRadialGradient(ME.x,ME.y,12,ME.x,ME.y,R);
    lg.addColorStop(0,'rgba(0,0,0,1)');lg.addColorStop(.5,'rgba(0,0,0,.78)');
    lg.addColorStop(1,'rgba(0,0,0,0)');
    lctx.fillStyle=lg;lctx.beginPath();lctx.arc(ME.x,ME.y,R,0,7);lctx.fill();
    lctx.globalCompositeOperation='source-over';
    ctx.drawImage(lightCv,0,0);
  }
}


/* ================= 3D 渲染器 =================
   游戏逻辑一行不动：模拟仍然是 2D 的 (x,y)，这里只是换一种呈现方式。
   x → 世界 X，y → 世界 Z，缩放 1/10。所以信息隔离、日记、盯梢全都不受影响，
   2D 渲染器完整保留：three.js 取不到、或者设备没有 WebGL，自动退回去。 */
const R3=(function(){
  const S=.1, wx=x=>(x-W/2)*S, wz=y=>(y-H/2)*S;   // 游戏坐标 → 世界坐标
  const WALL=2.6, FLOOR=.5;
  const cv3=document.getElementById('cv3');
  const api={on:false, ok:false, frame:null, toggle:null};

  let rnd,scene,cam,hemi,sun,torch,actors=[],spotMesh=[],bodyGrp,starField;
  let bodyPool=[], small=innerWidth<700;

  const hex=c=>parseInt(c.slice(1),16);
  function std(color,o){return new THREE.MeshStandardMaterial(Object.assign(
    {color:color,roughness:.82,metalness:.06},o||{}));}

  /* ---------- 墙体：沿一条边扣掉门洞后剩下的线段 ---------- */
  function segs(from,to,holes){
    const out=[]; let cur=from;
    holes.slice().sort((a,b)=>a[0]-b[0]).forEach(h=>{
      if(h[0]>cur) out.push([cur,h[0]]);
      cur=Math.max(cur,h[1]);});
    if(cur<to) out.push([cur,to]);
    return out;
  }
  function wall(par,x1,y1,x2,y2,mat){
    const len=Math.hypot(x2-x1,y2-y1); if(len<1)return;
    const g=new THREE.Mesh(new THREE.BoxGeometry(len*S,WALL,.5),mat);
    g.position.set(wx((x1+x2)/2),WALL/2,wz((y1+y2)/2));
    g.rotation.y=-Math.atan2(y2-y1,x2-x1);
    g.castShadow=true;g.receiveShadow=true;par.add(g);
  }

  function buildStation(){
    const st=new THREE.Group(); scene.add(st);
    const wallMat=std(0x222e43,{roughness:.72});
    const rimMat =std(0x1a2434,{roughness:.9});

    // 船体：沿每块可行走区域外扩一圈，轮廓跟着舱体走，而不是一整块大矩形
    const hullMat=std(0x0b111b,{roughness:1});
    solid.forEach(o=>{
      const m=new THREE.Mesh(new THREE.BoxGeometry(o.w*S+1.8,1.5,o.h*S+1.8),hullMat);
      m.position.set(wx(o.x+o.w/2),-1.25,wz(o.y+o.h/2)); m.receiveShadow=true; st.add(m);});

    // 走廊地板
    [...corrH,...corrV].forEach(c=>{
      const m=new THREE.Mesh(new THREE.BoxGeometry(c.w*S+.6,FLOOR,c.h*S+.6),std(0x1a2331));
      m.position.set(wx(c.x+c.w/2),-FLOOR/2,wz(c.y+c.h/2)); m.receiveShadow=true; st.add(m);});

    rooms.forEach(r=>{
      const acc=hex(ACCENT[r.i]);
      // 地板：房间主色调很淡地混进去，从上往下看一眼就知道在哪
      const f=new THREE.Mesh(new THREE.BoxGeometry(r.w*S,FLOOR,r.h*S),
        std(0x141c2a).clone());
      f.material.color.lerp(new THREE.Color(acc),.34);
      f.position.set(wx(r.cx),-FLOOR/2,wz(r.cy)); f.receiveShadow=true; st.add(f);

      // 灯带：贴着墙根一圈，断电时仍然亮着，当应急灯
      const strip=new THREE.Mesh(new THREE.BoxGeometry(r.w*S-1.2,.22,.22),
        new THREE.MeshStandardMaterial({color:acc,emissive:acc,emissiveIntensity:1.9,roughness:.35}));
      strip.position.set(wx(r.cx),.12,wz(r.y)+.5); st.add(strip);
      const strip2=strip.clone(); strip2.position.z=wz(r.y+r.h)-.5; st.add(strip2);

      // 四面墙，扣掉走廊门洞
      const L=r.x,R=r.x+r.w,T=r.y,B=r.y+r.h;
      const hL=corrH.filter(c=>Math.abs(c.x+c.w-L)<1).map(c=>[c.y,c.y+c.h]);
      const hR=corrH.filter(c=>Math.abs(c.x-R)<1).map(c=>[c.y,c.y+c.h]);
      const hT=corrV.filter(c=>Math.abs(c.y+c.h-T)<1).map(c=>[c.x,c.x+c.w]);
      const hB=corrV.filter(c=>Math.abs(c.y-B)<1).map(c=>[c.x,c.x+c.w]);
      segs(T,B,hL).forEach(g=>wall(st,L,g[0],L,g[1],wallMat));
      segs(T,B,hR).forEach(g=>wall(st,R,g[0],R,g[1],wallMat));
      segs(L,R,hT).forEach(g=>wall(st,g[0],T,g[1],T,wallMat));
      segs(L,R,hB).forEach(g=>wall(st,g[0],B,g[1],B,wallMat));

      // 房名：贴在地板上的字
      st.add(label(r.name,wx(r.cx),.07,wz(r.y)+2.8,'rgba(222,236,255,.95)',11,true));
    });

    // 走廊侧墙
    const cw=std(0x1b2534,{roughness:.78});
    corrH.forEach(c=>{wall(st,c.x,c.y,c.x+c.w,c.y,cw);wall(st,c.x,c.y+c.h,c.x+c.w,c.y+c.h,cw);});
    corrV.forEach(c=>{wall(st,c.x,c.y,c.x,c.y+c.h,cw);wall(st,c.x+c.w,c.y,c.x+c.w,c.y+c.h,cw);});

    // 通风口
    VENTS.flat().forEach(i=>{const v=ventPos(i);
      const b=new THREE.Mesh(new THREE.BoxGeometry(3.4,.3,2.4),std(0x1b2a36,{metalness:.4,roughness:.5}));
      b.position.set(wx(v.x),.1,wz(v.y)); b.receiveShadow=true; st.add(b);
      for(let k=-1;k<2;k++){
        const sl=new THREE.Mesh(new THREE.BoxGeometry(2.6,.12,.28),
          new THREE.MeshStandardMaterial({color:0x7abecd,emissive:0x2c5a66,roughness:.4}));
        sl.position.set(wx(v.x),.26,wz(v.y)+k*.7); st.add(sl);}
    });

    // 任务点：小控制台，归属船员还活着时用他的颜色，会呼吸
    SPOT.forEach(sp=>{
      const g=new THREE.Group();
      const base=new THREE.Mesh(new THREE.BoxGeometry(1.5,.9,1.1),std(0x2a3547));
      base.position.y=.45;base.castShadow=true;g.add(base);
      const scr=new THREE.Mesh(new THREE.BoxGeometry(1.2,.06,.8),
        new THREE.MeshStandardMaterial({color:0x8fa4c0,emissive:0x8fa4c0,emissiveIntensity:.6,roughness:.3}));
      scr.position.y=.93;g.add(scr);
      g.position.set(wx(sp.x),0,wz(sp.y));
      g.userData={scr,sp}; spotMesh.push(g); st.add(g);
    });
  }

  /* ---------- 文字：画进贴图再贴成 sprite / 地面片 ---------- */
  function label(text,x,y,z,color,size,flat){
    const c=document.createElement('canvas'),g=c.getContext('2d');
    c.width=512;c.height=128;
    g.font='700 76px "PingFang SC","Microsoft YaHei",sans-serif';
    g.textAlign='center';g.textBaseline='middle';g.fillStyle=color;
    g.shadowColor='rgba(0,0,0,.85)';g.shadowBlur=10;
    g.fillText(text,256,68);
    const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
    if(flat){
      const m=new THREE.Mesh(new THREE.PlaneGeometry(size,size/4),
        new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));
      m.rotation.x=-Math.PI/2; m.position.set(x,y,z); return m;
    }
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
    sp.scale.set(size,size/4,1); sp.position.set(x,y,z); return sp;
  }

  /* ---------- 角色 ---------- */
  function buildActors(){
    P.forEach(p=>{
      const g=new THREE.Group();
      const col=hex(p.col);
      const body=new THREE.Mesh(new THREE.SphereGeometry(1.5,20,14),
        std(col,{roughness:.45,metalness:.1}));
      body.scale.set(1,1.2,1); body.position.y=1.75; body.castShadow=true; g.add(body);
      const visor=new THREE.Mesh(new THREE.SphereGeometry(.8,16,12),
        new THREE.MeshStandardMaterial({color:0xbfe0ff,emissive:0x35618c,roughness:.12,metalness:.35}));
      visor.position.set(0,2.0,1.1); g.add(visor);
      const pack=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.4,.7),std(0x2b3446));
      pack.position.set(0,1.7,-1.15); pack.castShadow=true; g.add(pack);
      // 任务进度环（贴地）
      const ring=new THREE.Mesh(new THREE.RingGeometry(1.9,2.35,28,1,-Math.PI/2,0),
        new THREE.MeshBasicMaterial({color:0x4fbf9a,transparent:true,opacity:.95,side:THREE.DoubleSide}));
      ring.rotation.x=-Math.PI/2; ring.position.y=.08; ring.visible=false; g.add(ring);
      // 被目击时的黄圈
      const seen=new THREE.Mesh(new THREE.RingGeometry(2.5,2.8,32),
        new THREE.MeshBasicMaterial({color:0xe7a83f,transparent:true,opacity:.9,side:THREE.DoubleSide}));
      seen.rotation.x=-Math.PI/2; seen.position.y=.06; seen.visible=false; g.add(seen);
      const nm=label(p.name,0,4.5,0,'rgba(232,242,255,.97)',7);
      g.add(nm);
      scene.add(g);
      actors.push({p,g,body,ring,seen,bucket:-1});
    });
    // 内鬼（你）脚下一圈紫色标记，免得找不到自己
    const meMark=new THREE.Mesh(new THREE.RingGeometry(2.0,2.2,32),
      new THREE.MeshBasicMaterial({color:0x8663e0,transparent:true,opacity:.8,side:THREE.DoubleSide}));
    meMark.rotation.x=-Math.PI/2; meMark.position.y=.04; actors[0].g.add(meMark);
  }

  function starfield(){
    const n=700,pos=new Float32Array(n*3);
    for(let i=0;i<n;i++){
      const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), r=200+Math.random()*160;
      pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.cos(ph); pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);}
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    return new THREE.Points(g,new THREE.PointsMaterial({color:0xbcd2ee,size:1.1,sizeAttenuation:true,transparent:true,opacity:.8}));
  }

  /* ---------- 相机：正交 + 俯角，整张图始终看得全 ---------- */
  function fit(){
    const w=cv3.clientWidth||1, h=cv3.clientHeight||1, a=w/h;
    let vw=51.5, vh=34;                       // 需要覆盖的世界半宽/半高
    if(a>vw/vh) vw=vh*a; else vh=vw/a;
    cam.left=-vw;cam.right=vw;cam.top=vh;cam.bottom=-vh;
    cam.updateProjectionMatrix();
    rnd.setSize(w,h,false);
  }

  function init(){
    if(window.__no3d||!window.THREE) return false;
    try{
      rnd=new THREE.WebGLRenderer({canvas:cv3,antialias:!small,powerPreference:'high-performance'});
    }catch(e){ return false; }
    if(!rnd.getContext()) return false;
    rnd.setPixelRatio(Math.min(devicePixelRatio,small?1.25:1.75));
    rnd.shadowMap.enabled=true; rnd.shadowMap.type=THREE.PCFSoftShadowMap;
    rnd.outputEncoding=THREE.sRGBEncoding;

    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x05070d);
    scene.fog=new THREE.Fog(0x05070d,110,230);
    starField=starfield(); scene.add(starField);

    cam=new THREE.OrthographicCamera(-1,1,1,-1,.5,400);
    cam.position.set(0,118,84); cam.lookAt(0,0,0);

    hemi=new THREE.HemisphereLight(0x5477a8,0x080c14,.34); scene.add(hemi);
    sun=new THREE.DirectionalLight(0xe6f0ff,1.35);
    sun.position.set(46,86,34); sun.castShadow=true;
    const SM=small?768:1024; sun.shadow.mapSize.set(SM,SM);
    sun.shadow.camera.near=20; sun.shadow.camera.far=220;
    sun.shadow.camera.left=-62; sun.shadow.camera.right=62;
    sun.shadow.camera.top=48; sun.shadow.camera.bottom=-48;
    sun.shadow.bias=-.0007; sun.shadow.normalBias=.4;
    scene.add(sun);

    // 断电时挂在玩家身上的手电
    torch=new THREE.PointLight(0xffe0b0,0,34,2); torch.position.y=3; scene.add(torch);

    buildStation(); buildActors();
    bodyGrp=new THREE.Group(); scene.add(bodyGrp);
    fit(); addEventListener('resize',fit);
    if(window.ResizeObserver) new ResizeObserver(fit).observe(cv3);
    return true;
  }

  /* 跑不动就自己降级：先砍画质，还不行就退回 2D。
     dt 有 0.05s 上限，帧率一低游戏会变成慢动作——所以这不只是好不好看的问题。 */
  let pf={n:0,t:0,last:0,tier:0,warm:0};
  function watchPerf(){
    const now=performance.now();
    if(!pf.last){pf.last=now;return;}
    const d=(now-pf.last)/1000; pf.last=now;
    if(pf.warm<1.5){pf.warm+=d;return;}      // 前 1.5s 在编译 shader，不算
    if(pf.tier>1)return;
    pf.n++; pf.t+=d; if(pf.t<3)return;
    const fps=pf.n/pf.t; pf.n=0; pf.t=0;
    if(fps>=24)return;
    if(pf.tier===0){ pf.tier=1;
      rnd.shadowMap.enabled=false; sun.castShadow=false;
      rnd.setPixelRatio(1); fit();
      note('帧率偏低，已自动关闭 3D 阴影');
    } else { pf.tier=2; api.toggle(false); note('设备跑不动 3D，已切回 2D'); }
  }

  function frame(){
    watchPerf();
    // 任务点
    spotMesh.forEach(g=>{
      const sp=g.userData.sp;
      g.visible=!sp.done;
      if(sp.done)return;
      const live=sp.owner>0&&P[sp.owner].alive;
      const m=g.userData.scr.material;
      m.color.set(live?hex(P[sp.owner].col):0x8fa4c0);
      m.emissive.set(m.color);
      m.emissiveIntensity=live?(.5+.45*(.5+.5*Math.sin(t*2.2+sp.x*.05))):.28;
    });

    const wit=new Set(witnesses().map(a=>a.id));
    actors.forEach(a=>{
      const p=a.p;
      a.g.visible=p.alive;
      if(!p.alive)return;
      updateFacing(p);
      a.g.position.set(wx(p.x),(p._bob||0)*S*1.6,wz(p.y));
      a.g.rotation.y=Math.atan2(Math.cos(p.face),Math.sin(p.face));
      // 任务进度：只在进度桶变化时重建几何，不是每帧
      if(p.doing){
        const b=Math.max(1,Math.round((1-p.tt/p.tmax)*24));
        if(b!==a.bucket){ a.ring.geometry.dispose();
          a.ring.geometry=new THREE.RingGeometry(1.9,2.35,28,1,-Math.PI/2,b/24*Math.PI*2);
          a.bucket=b; }
        a.ring.material.color.set(p.imp?0x8663e0:0x4fbf9a);
        a.ring.visible=true;
      } else { a.ring.visible=false; a.bucket=-1; }
      a.seen.visible=wit.has(p.id);
    });

    // 尸体
    while(bodyPool.length<bodies.length){
      const g=new THREE.Group();
      const b=new THREE.Mesh(new THREE.SphereGeometry(1.5,16,12),std(0xffffff,{roughness:.6}));
      b.scale.set(1.3,.55,1); b.position.y=.75; b.castShadow=true; g.add(b);
      const pool=new THREE.Mesh(new THREE.CircleGeometry(2.6,24),
        new THREE.MeshBasicMaterial({color:0x120a10,transparent:true,opacity:.72}));
      pool.rotation.x=-Math.PI/2; pool.position.y=.05; g.add(pool);
      bodyPool.push(g); bodyGrp.add(g);
    }
    bodyPool.forEach((g,i)=>{
      const b=bodies[i]; g.visible=!!b; if(!b)return;
      g.position.set(wx(b.x),0,wz(b.y));
      g.children[0].material.color.set(hex(COL[b.id]));
    });

    // 光照：断电 → 主光几乎全灭，玩家身上点一盏真的灯
    const dark=emg===1;
    hemi.intensity+= ((dark?.07:.34)-hemi.intensity)*.12;
    sun.intensity += ((dark?.06:1.35)-sun.intensity )*.12;
    torch.intensity+=((dark?2.4:0)-torch.intensity)*.14;
    torch.distance=vision()*S*2.2;
    torch.position.set(wx(ME.x),3,wz(ME.y));
    if(emg===2){ const f=.5+.5*Math.sin(t*6);
      hemi.color.setHex(0xc05a4e); hemi.intensity=.30+.28*f; }
    else hemi.color.setHex(0x5477a8);

    starField.rotation.y=t*.004;
    rnd.render(scene,cam);
  }

  api.frame=frame;
  api.lights=()=>({hemi:+hemi.intensity.toFixed(3),sun:+sun.intensity.toFixed(3),
                   torch:+torch.intensity.toFixed(3),tier:pf.tier});
  api.toggle=function(want){
    if(!api.ok) return false;
    api.on = want===undefined ? !api.on : !!want;
    cv3.hidden=!api.on; cv.hidden=api.on;
    try{localStorage.setItem('impostor_3d',api.on?'1':'0');}catch(e){}
    const b=document.getElementById('b3d');
    if(b){b.textContent=api.on?'3D':'2D';b.classList.toggle('live',api.on);}
    if(api.on) fit();
    return api.on;
  };
  api.ok=init();
  if(!api.ok){ const b=document.getElementById('b3d'); if(b)b.hidden=true; }
  else {
    let want=true; try{const v=localStorage.getItem('impostor_3d'); if(v!==null)want=v==='1';}catch(e){}
    api.toggle(want);
    document.getElementById('b3d').onclick=()=>api.toggle();
  }
  return api;
})();


/* ================= LLM 客户端：主/备双端点 + 重试 + 规则兜底 ================= */
const LS='impostor_llm_cfg';
let CFG={base:'',key:'',model:'',base2:'',key2:'',model2:''};
try{Object.assign(CFG,JSON.parse(localStorage.getItem(LS)||'{}'));}catch(e){}
const hasLLM=()=>!!(CFG.key&&CFG.base&&CFG.model);
let llmState='off';   /* off | live | err */

const cfgEl=document.getElementById('cfg');
const $=id=>document.getElementById(id);
function cfgLoad(){$('cBase').value=CFG.base;$('cKey').value=CFG.key;$('cModel').value=CFG.model;
  $('cBase2').value=CFG.base2;$('cKey2').value=CFG.key2;$('cModel2').value=CFG.model2;}
function cfgSave(){CFG={base:$('cBase').value.trim().replace(/\/$/,''),key:$('cKey').value.trim(),
  model:$('cModel').value.trim(),base2:$('cBase2').value.trim().replace(/\/$/,''),

async function once(base,key,model,user,sys,maxTok,ms){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),ms);
  try{
    const res=await fetch(base+'/chat/completions',{method:'POST',signal:ctl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model,temperature:.85,max_tokens:maxTok,
        messages:[{role:'system',content:sys},{role:'user',content:user}]})});
    if(!res.ok){const b=await res.text();throw new Error('HTTP '+res.status+' '+b.slice(0,90));}
    const j=await res.json();
    return {ok:!0,text:(j.choices?.[0]?.message?.content||'').trim()};
  }finally{clearTimeout(to);}
}

/* 主端点重试 2 次 → 备用端点重试 1 次 → 失败 */
async function callLLM(user,sys,maxTok=320,ms=22000){
  let err='未配置';
  if(CFG.key&&CFG.base&&CFG.model){
    for(let i=0;i<2;i++){
      try{const r=await once(CFG.base,CFG.key,CFG.model,user,sys,maxTok,ms);
        llmState='live';badge();return r;}
      catch(e){err=e.name==='AbortError'?'超时':String(e.message||e);
        if(i===0)await sleep(700);}
    }
  }
  if(CFG.key2&&CFG.base2&&CFG.model2){
    try{const r=await once(CFG.base2,CFG.key2,CFG.model2,user,sys,maxTok,ms);
      llmState='live';badge();return r;}
    catch(e){err='备用也失败：'+(e.name==='AbortError'?'超时':String(e.message||e));}
  }
  llmState='err';badge();
  return {ok:!1,err};
}

/* 从模型输出里抠 JSON（模型爱裹 markdown 代码块） */
function grabJSON(s){
  if(!s)return null;
  let x=s.replace(/```json?/gi,'').replace(/```/g,'').trim();
  const a=x.indexOf('{'),b=x.lastIndexOf('}');
  if(a<0||b<a)return null;
  try{return JSON.parse(x.slice(a,b+1));}catch(e){}
  try{return JSON.parse(x.slice(a,b+1).replace(/,(\s*[}\]])/g,'$1'));}catch(e){}
  return null;
}

function read(a,body,win){            /* 规则版兜底：模型不可用时仍然能玩 */
  const ev=slice(a,win[0],win[1]);
  const score={},mine={},tkc={}; let inCrime=0,sawKill=null,sawVent=!1,lastWith=null;
  ev.forEach(e=>{
    if(e.kill)sawKill=e.kill.v; if(e.vent)sawVent=!0;
    if(e.room===body.room)inCrime++;
    (e.tk||[]).forEach(id=>tkc[id]=(tkc[id]||0)+1);
    e.saw.forEach(id=>{mine[id]=(mine[id]||0)+1;
      if(e.room===body.room&&id!==body.id)score[id]=(score[id]||0)+7/(ev.length||1);
      if(e.saw.includes(body.id)&&id!==body.id)lastWith=id;});});
  P.filter(p=>p.alive&&p!==a).forEach(p=>{
    const r=(mine[p.id]||0)/(ev.length||1);
    if(r>.55&&inCrime===0)score[p.id]=(score[p.id]||0)-7*r;
    else if(r<.05)score[p.id]=(score[p.id]||0)+2.2;
    if((tkc[p.id]||0)>=3)score[p.id]=(score[p.id]||0)-4;});
  if(lastWith!==null)score[lastWith]=(score[lastWith]||0)+5;
  if(sawKill!==null)score[0]=(score[0]||0)+120;
  if(sawVent)score[0]=(score[0]||0)+120;
  const cnt={};ev.forEach(e=>cnt[e.room]=(cnt[e.room]||0)+1);
  const mainRoom=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0]||'走廊';
  const withMe=Object.keys(mine).filter(k=>mine[k]/(ev.length||1)>.4).map(k=>NM[k]);
  const busy=Object.keys(tkc).filter(k=>tkc[k]>=3).map(k=>NM[k]);
  let line='我这段时间基本在'+mainRoom+(withMe.length?'，'+withMe.join('、')+'跟我一起。':'，一个人。');
  if(busy.length)line+='看见 '+busy.join('、')+' 在做任务。';
  if(sawKill!==null)line='我亲眼看见 紫 把 '+NM[sawKill]+' 放倒了。别投别人。';
  else if(sawVent)line='我看见 紫 钻了通风口。就是他。';
  else if(lastWith!==null&&lastWith!==body.id)line+='最后一次看到 '+NM[body.id]+' 活着的时候，'+NM[lastWith]+' 就在旁边。';
  else if(a===M.reporter)line='尸体是我在'+body.room+'发现的。'+line;
  return {who:a.id,score,mainRoom,mine,tkc,ev,line,src:'rule'};
}

/* ---------- 日记 → 模型输入 ---------- */
function diaryFor(a,body,win){
  const ev=slice(a,win[0],win[1]);
  return {
    you:a.name, role:'crewmate',
    body:{victim:NM[body.id],room:body.room,found_at:win[1],found_by:M.reporter.name},
    window:win, tasks_done:taskDone+'/'+taskTotal,
    alive:P.filter(p=>p.alive).map(p=>p.name),
    memory:ev.map(e=>({t:e.t,room:e.room,saw:e.saw.map(i=>NM[i]),
      doing_task:(e.tk||[]).map(i=>NM[i]),
      ...(e.dark?{dark:!0}:{}), ...(e.kill?{SAW_KILL:NM[e.kill.v]+' 被 '+NM[0]+' 杀死'}:{}),
      ...(e.vent?{SAW_VENT:NM[0]+' 钻进了通风口'}:{})}))
  };
}

const SYS_CREW=`你在玩一局太空狼人杀（Among Us 规则）。你是一名船员，不是内鬼。
有人死了，现在开紧急会议。你会拿到一份【目击日记】——这是你自己在案发时间窗内每半秒记录的所见，
是你唯一可靠的信息来源。日记里没写的事，你就是不知道，绝不能编造。

日记字段含义：
- t: 时间戳(秒)  room: 你当时所在的房间  saw: 你当时看得见的人
- doing_task: 你看见谁蹲在任务点上做任务（内鬼做不了真任务，但可以假装）
- dark: 当时断电了，视野只有平时一半
- SAW_KILL: 你亲眼看见的击杀（这是铁证）
- SAW_VENT: 你亲眼看见有人钻通风口（这是铁证，船员不会用通风管）

推理要点：
- 全程和你待在一起的人，基本可以排除
- 你从没见过、且时间窗内说不清去向的人，最可疑
- 有人自称在某房间，但你的日记显示他当时在别处 —— 这是硬矛盾，直接点破
- 有人自称在做任务，但你日记里 doing_task 从没出现过他 —— 追问他做的是哪个任务
- 任务条一格没动，说明没人在真做任务

只输出 JSON，不要任何解释文字：
{"line":"你的发言，35-70字，第一人称，口语化，像真人在吵架，要引用具体时间和房间","suspect":{"红":0.6,"蓝":0.1}}
suspect 里给每个活着的人一个 0-1 的怀疑度，你自己不用写。名字必须和 alive 列表完全一致。`;

async function readLLM(a,body,win){
  const d=diaryFor(a,body,win);
  const r=await callLLM(JSON.stringify(d,null,1),SYS_CREW,320);
  if(!r.ok)return null;
  const j=grabJSON(r.text);
  if(!j||!j.line)return null;
  const base=read(a,body,win);           /* 借规则版的 ev/mine/tkc 给后面的对账用 */
  const score={};
  if(j.suspect&&typeof j.suspect==='object'){
    for(const k in j.suspect){const id=NM.indexOf(k);
      if(id>=0&&id!==a.id){const v=Math.max(0,Math.min(1,+j.suspect[k]||0));score[id]=v*14;}}
  }
  /* 铁证不容模型忽略：亲眼看见击杀/钻管道，怀疑度强制拉满 */
  const ev=base.ev;
  if(ev.some(e=>e.kill)||ev.some(e=>e.vent))score[0]=(score[0]||0)+120;
  return {...base,line:String(j.line).slice(0,160),score,src:'llm'};
}

const SYS_JUDGE=`你在玩太空狼人杀。你是船员，正在开会。刚才嫌疑人说了一句为自己开脱的话。
你要拿他这句话，和你自己的【目击日记】逐条对账。

日记是你亲眼所见，是硬事实。嫌疑人的话可能是真的，也可能是编的。

判断规则：
- 他说他在某个房间，但你日记里同一时间段在别的房间看见他 → 矛盾，verdict="contradict"
- 他说他在某房间，你日记显示你自己整段都在那个房间却从没见过他 → 矛盾，verdict="contradict"
- 他说的和你日记吻合（你确实在那儿看见过他）→ verdict="confirm"
- 他说他在做任务，而你日记 doing_task 里出现过他 → verdict="confirm"
- 他说他在做任务，但你从没见他蹲过任务点 → verdict="contradict"
- 你的日记里压根没有相关记录，说不清 → verdict="unknown"
- 如果你日记里有 SAW_KILL 或 SAW_VENT，无论他说什么都是 verdict="contradict"，你亲眼所见

只输出 JSON：
{"verdict":"contradict|confirm|unknown","line":"你的回应，25-55字，口语化。矛盾就带上具体时间和房间去戳穿他","delta":0.7}
delta 是你对他怀疑度的变化，-1到1。戳穿用正数，作证用负数，说不清用0附近。`;

async function defend(txt){
  ovC.innerHTML='';
  M.claim=txt;
  say('','<b style="color:#8663e0">紫(你)</b>：'+txt.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])));

  if(!hasLLM()){ return defendRule(txt); }

  const th=document.createElement('p');th.className='say think';
  th.textContent='他们在核对日记…';ovLog.appendChild(th);

  const crew=P.filter(p=>p.alive&&!p.imp);
  const rs=await Promise.all(crew.map(async a=>{
    const f=M.facts.find(x=>x.who===a.id);
    const d=diaryFor(a,M.body,M.win);
    d.suspect_says=txt; d.suspect_name=NM[0];
    const r=await callLLM(JSON.stringify(d,null,1),SYS_JUDGE,260).catch(()=>({ok:!1}));
    if(!r.ok)return null;
    const j=grabJSON(r.text);
    if(!j||!j.line)return null;
    return {a,j,f};
  }));
  th.remove();

  let handled=0;
  rs.forEach(x=>{
    if(!x)return;
    handled++;
    const {a,j}=x;
    const v=String(j.verdict||'unknown');
    const d=Math.max(-1,Math.min(1,+j.delta||0));
    M.susp[a.id][0]=(M.susp[a.id][0]||1)+d*11;
    say(v==='contradict'?'hit':(v==='confirm'?'ok':''),
      '<b style="color:'+a.col+'">'+a.name+'</b>：'+String(j.line).slice(0,140));
  });

  if(!handled){ say('sys','⚠ 模型没能应答，改用关键词对账。'); return defendRule(txt); }
  setTimeout(vote,1000);
}

/* 规则兜底：从自由文本里抠出房间名/任务关键词，走原来的对账逻辑 */
function defendRule(txt){
  const room=RN.find(r=>txt.includes(r));
  const taskish=/任务|干活|接线|修|做事|扫描|加油|下载/.test(txt);
  let hit=0,ok=0;
  M.facts.forEach(f=>{const a=P[f.who],ev=f.ev;
    /* 同时提到房间和任务时，两项都要对账 */
    if(room&&taskish){
      const elsewhere=ev.filter(e=>e.saw.includes(0)&&e.room!==room);
      if(elsewhere.length>=2){M.susp[a.id][0]+=9;hit++;
        say('hit','<b style="color:'+a.col+'">'+a.name+'</b>：不对。t='+elsewhere[0].t+'s 我在'+elsewhere[0].room+'看见你了。');}
      else if((f.tkc[0]||0)>=3){M.susp[a.id][0]-=8;ok++;
        say('ok','<b style="color:'+a.col+'">'+a.name+'</b>：我确实看见他在'+room+'蹲任务点。');}
      else{M.susp[a.id][0]+=5;hit++;
        say('hit','<b style="color:'+a.col+'">'+a.name+'</b>：我没见你在'+room+'做过任务，任务条也没动。');}
    }
    else if(room){
      const elsewhere=ev.filter(e=>e.saw.includes(0)&&e.room!==room);
      const there=ev.filter(e=>e.saw.includes(0)&&e.room===room).length;
      const been=ev.filter(e=>e.room===room).length;
      if(elsewhere.length>=2){M.susp[a.id][0]+=9;hit++;
        say('hit','<b style="color:'+a.col+'">'+a.name+'</b>：不对。t='+elsewhere[0].t+'s 我在'+elsewhere[0].room+'看见你了。');}
      else if(there>=2){M.susp[a.id][0]-=6;ok++;
        say('ok','<b style="color:'+a.col+'">'+a.name+'</b>：这个我能作证，那会儿他确实在'+room+'。');}
      else if(been>=4){M.susp[a.id][0]+=7;hit++;
        say('hit','<b style="color:'+a.col+'">'+a.name+'</b>：我整段都在'+room+'，没见过你。');}
      else M.susp[a.id][0]+=1;
    } else if(taskish){
      if((f.tkc[0]||0)>=3){M.susp[a.id][0]-=9;ok++;
        say('ok','<b style="color:'+a.col+'">'+a.name+'</b>：确实，我看见他蹲在任务点上。');}
      else{M.susp[a.id][0]+=4;hit++;
        say('hit','<b style="color:'+a.col+'">'+a.name+'</b>：任务条这段时间一格没动。你做的是哪个任务？');}
    } else {
      M.susp[a.id][0]+=2.5;
    }});
  if(!room&&!taskish)say('hit','含糊其辞不是中立。四个人的怀疑度都往你这边挪了一点。');
  else if(!hit&&!ok)say('sys','没人能证实，也没人能推翻。你活在证据的缝里。');
  setTimeout(vote,1000);
}

function vote(){
  const alive=P.filter(p=>p.alive),votes={},lines=[];
  alive.filter(p=>!p.imp).forEach(a=>{let best=null,bs=4.5;
    for(const k in M.susp[a.id]) if(M.susp[a.id][k]>bs){bs=M.susp[a.id][k];best=+k;}
    lines.push(a.name+' → '+(best===null?'弃票':NM[best]));
    if(best!==null)votes[best]=(votes[best]||0)+1;});
  say('sys','投票结果：');
  const box=document.createElement('div');box.className='tallies';
  lines.forEach(l=>{const s=document.createElement('span');s.className='tag';s.textContent=l;box.appendChild(s);});
  ovLog.appendChild(box);
  let out=null,mx=0,tie=!1;
  for(const k in votes){if(votes[k]>mx){mx=votes[k];out=+k;tie=!1;}else if(votes[k]===mx)tie=!0;}
  ovC.innerHTML='';
  const b=document.createElement('button');b.style.flexBasis='100%';b.textContent='继续';
  if(out===null||tie||mx<2)say('ok','票数不足或平票，没有人被抛出。');
  else{P[out].alive=!1;
    if(out===0){say('hit',NM[out]+' 被抛出飞船。');ovLog.appendChild(diaryBox());
      return setTimeout(()=>end(!1,'他们把日记对上了，你被抛了出去。'),500);}
    release(out);
    say('hit',NM[out]+' 被抛出飞船。他不是内鬼 —— 任务总数没变，干活的人少了一个。');}
  ovLog.appendChild(diaryBox());
  b.onclick=close; ovC.appendChild(b);
  ovLog.scrollTop=ovLog.scrollHeight;
}
function diaryBox(){
  const w=document.createElement('div');
  const a=P.filter(p=>p.alive&&!p.imp)[0]||P[1];
  const f=M.facts.find(x=>x.who===a.id)||M.facts[0];
  const payload={you:a.name,role:'crewmate',
    body:{victim:NM[M.body.id],room:M.body.room,found_at:M.win[1]},
    window:M.win, tasks_done:taskDone+'/'+taskTotal,
    memory:(f?f.ev:[]).map(e=>({t:e.t,room:e.room,saw:e.saw.map(i=>NM[i]),
      doing_task:(e.tk||[]).map(i=>NM[i]),dark:e.dark})),
    heard:M.facts.map(x=>({from:NM[x.who],says:x.line})),
    suspect_says:M.claim};
  const d=document.createElement('details');
  const tagsrc=(f&&f.src==='llm')?'模型推理':'规则推理';
  d.innerHTML='<summary style="cursor:pointer;color:#8493ab;font-size:12.5px;margin:6px 0">查看 '+a.name+' 的目击日记 · 本轮由'+tagsrc+'</summary>';
  const pre=document.createElement('pre');pre.className='diary';pre.textContent=JSON.stringify(payload,null,1);
  const n=document.createElement('p');n.className='note';
  n.textContent=hasLLM()
    ?'这份 JSON 就是喂给模型的原始输入。四个船员各自读自己那份，输出 {发言, 怀疑度}，再拿你的辩解逐条对账。'
    :'现在是一段规则在读这份 JSON。点右上角「AI」填入模型配置，同一份日记就会交给真模型推理。';
  d.appendChild(pre);d.appendChild(n);w.appendChild(d);return w;
}
function close(){ov.classList.remove('show');meeting=!1;killCD=Math.max(killCD,8);bodies=[];emg=0;
  SPOT.forEach(s=>{if(!s.done)s.owner=-1;});
  const c=rooms[1];
  P.filter(p=>p.alive).forEach((p,i)=>{p.x=c.cx+(i-2)*40;p.y=c.cy+(i%2?24:-16);
    p.path=[];p.mt=null;p.tt=0;p.doing=!1;p.fixing=!1;p.cur=null;});
  if(P.filter(p=>p.alive&&!p.imp).length<=1)end(!0,'船员只剩一个了。刀完收工。');}
function say(cls,html){const p=document.createElement('p');p.className='say '+cls;p.innerHTML=html;
  ovLog.appendChild(p);ovLog.scrollTop=ovLog.scrollHeight;}
function end(win,msg){if(over)return;over=!0;ov.classList.remove('show');
  const T=document.getElementById('endT');
  T.textContent=win?'内鬼获胜':'船员获胜'; T.style.color=win?'#cf4b3d':'#4fbf9a';
  document.getElementById('endP').textContent=msg;
  document.getElementById('endS').classList.add('show');}
})();
</script></body></html>
